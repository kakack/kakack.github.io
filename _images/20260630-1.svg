<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
<title id="title">训练显存：常驻底座 + 瞬时峰值</title><desc id="desc">GPU 显存由模型状态和计算临时张量叠加，OOM 由峰值决定。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1L11 6L1 11" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowO" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1L11 6L1 11" fill="none" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .title{font:700 38px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#141413}
  .label{font:600 24px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#141413;text-anchor:middle}
  .small{font:500 18px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#756F68;text-anchor:middle}
  .tiny{font:500 15px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#756F68;text-anchor:middle}
  .ink{fill:none;stroke:#141413;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
  .thin{fill:none;stroke:#141413;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .flowO{fill:none;stroke:#D97757;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowO)}
  .dash{fill:none;stroke:#141413;stroke-width:3;stroke-dasharray:9 10;stroke-linecap:round}
</style>
<rect width="1600" height="780" fill="#FAF9F5"/>
<text class="title" x="52" y="62">训练显存：常驻底座 + 瞬时峰值</text><path d="M52 84C430 82 1010 86 1548 83" stroke="#141413" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M99 127 Q78 129 78 149 L80 701 Q79 722 100 722 L1031 720 Q1052 721 1052 700 L1050 148 Q1051 129 1030 128 Z" fill="#FAF9F5" stroke="#141413" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="small" x="99" y="159" style="text-anchor:start;fill:#141413">单卡 GPU 显存</text><text class="small" x="110" y="185" style="text-anchor:start;fill:#D97757">瞬时峰值</text><g transform="rotate(0 227.5 485.0)"><path d="M143 397 Q128 398 127 413 L129 558 Q130 573 145 574 L312 572 Q328 573 327 556 L329 413 Q327 398 311 399 Z" fill="#6A9BCC" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="227.5" y="493.0" style="text-anchor:middle;fill:#FAF9F5">Activations</text></g><g transform="rotate(0 422.5 452.5)"><path d="M363 332 Q348 333 347 348 L349 558 Q350 573 365 574 L482 572 Q498 573 497 556 L499 348 Q497 333 481 334 Z" fill="#FAF9F5" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="422.5" y="460.5" style="text-anchor:middle;fill:#141413">Workspace</text></g><g transform="rotate(0 642.5 420.0)"><path d="M558 267 Q543 268 542 283 L544 558 Q545 573 560 574 L727 572 Q743 573 742 556 L744 283 Q742 268 726 269 Z" fill="#D97757" stroke="#D97757" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="642.5" y="428.0" style="text-anchor:middle;fill:#FAF9F5">Logits</text></g><g transform="rotate(0 870.0 440.0)"><path d="M798 307 Q783 308 782 323 L784 558 Q785 573 800 574 L942 572 Q958 573 957 556 L959 323 Q957 308 941 309 Z" fill="#FAF9F5" stroke="#D97757" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="870.0" y="448.0" style="text-anchor:middle;fill:#141413">Loss buffers</text></g><path d="M105 590C350 586 620 594 1018 588" stroke="#141413" stroke-width="4" fill="none"/><text class="small" x="110" y="620" style="text-anchor:start">常驻模型状态</text><g transform="rotate(0 242.5 667.5)"><path d="M138 637 Q123 638 122 653 L124 683 Q125 698 140 699 L347 697 Q363 698 362 681 L364 653 Q362 638 346 639 Z" fill="#6A9BCC" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="242.5" y="675.5" style="text-anchor:middle;fill:#FAF9F5">Parameters</text></g><g transform="rotate(0 532.5 667.5)"><path d="M428 637 Q413 638 412 653 L414 683 Q415 698 430 699 L637 697 Q653 698 652 681 L654 653 Q652 638 636 639 Z" fill="#6A9BCC" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="532.5" y="675.5" style="text-anchor:middle;fill:#FAF9F5">Gradients</text></g><g transform="rotate(0 822.5 667.5)"><path d="M718 637 Q703 638 702 653 L704 683 Q705 698 720 699 L927 697 Q943 698 942 681 L944 653 Q942 638 926 639 Z" fill="#6A9BCC" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="822.5" y="675.5" style="text-anchor:middle;fill:#FAF9F5">Optimizer</text></g><path class="flowO" d="M1115 610V205"/><text class="label" x="1200" y="295" style="text-anchor:start"><tspan x="1200" dy="0">OOM 看的是</tspan><tspan x="1200" dy="32">同一时刻的峰值</tspan></text><text class="small" x="1200" y="405" style="text-anchor:start"><tspan x="1200" dy="0">模型状态被切开</tspan><tspan x="1200" dy="30">≠ 临时张量被切开</tspan></text></svg>
