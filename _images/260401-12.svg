<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">三道信息边界：身份、推理与客户端</title>
  <desc id="desc">根据文章中的社区分析，对外部仓库、流量观察者与修改版客户端分别设置身份、推理和请求认证边界。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    .title{font:700 41px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#141413}
    .rowtitle{font:700 23px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#141413}
    .label{font:600 21px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#141413;text-anchor:middle}
    .small{font:500 17px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#5F5A54;text-anchor:middle}
    .tiny{font:600 15px Poppins,Inter,"PingFang SC","Noto Sans SC",sans-serif;fill:#5F5A54;letter-spacing:.8px}
    .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#141413;stroke-width:2.5;stroke-dasharray:9 11;stroke-linecap:round;opacity:.55}
  </style>
  <rect width="1600" height="840" fill="#E3DACC"/>
  <text class="title" x="55" y="65">三道信息边界：身份、推理与客户端</text>
  <path d="M55 88C442 82 1112 91 1546 84" fill="none" stroke="#141413" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M54 137Q53 118 76 119C401 111 1152 126 1533 118Q1552 117 1548 140L1552 739Q1551 761 1529 758C1110 768 421 750 73 760Q52 759 55 738Z" fill="#FAF9F5" stroke="#141413" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="tiny" x="88" y="173">BOUNDARY 01</text><text class="rowtitle" x="88" y="205">外部身份</text>
  <g transform="rotate(-.18 354 205)"><path d="M252 157Q239 158 240 172L242 237Q242 250 256 249L452 251Q465 250 464 235L465 173Q464 159 449 160Z" fill="#D97757" stroke="#141413" stroke-width="4" stroke-linejoin="round"/><text class="label" x="353" y="200">Public repo</text><text class="small" x="353" y="225">外部协作面</text></g>
  <path class="flow" d="M468 205H594"/>
  <g transform="rotate(.18 737 205)"><path d="M602 148Q587 149 589 165L590 244Q590 260 607 258L866 260Q883 259 881 242L883 165Q881 149 864 151Z" fill="#FAF9F5" stroke="#D97757" stroke-width="5" stroke-linejoin="round"/><text class="label" x="736" y="199">Undercover</text><text class="small" x="736" y="228">剥离 AI 身份标记</text></g>
  <path class="flow" d="M886 205H1014"/>
  <g transform="rotate(-.15 1262 205)"><path d="M1021 157Q1008 158 1009 172L1011 237Q1011 250 1025 249L1498 251Q1511 250 1510 235L1511 173Q1510 159 1495 160Z" fill="#6A9BCC" stroke="#141413" stroke-width="4" stroke-linejoin="round"/><text class="label" x="1261" y="200">Clean commit metadata</text><text class="small" x="1261" y="225">不暴露模型来源</text></g>

  <path class="dash" d="M88 293C460 286 1090 299 1513 291"/>
  <text class="tiny" x="88" y="342">BOUNDARY 02</text><text class="rowtitle" x="88" y="374">推理可见性</text>
  <g transform="rotate(.18 354 374)"><path d="M252 326Q239 327 240 341L242 406Q242 419 256 418L452 420Q465 419 464 404L465 342Q464 328 449 329Z" fill="#D97757" stroke="#141413" stroke-width="4" stroke-linejoin="round"/><text class="label" x="353" y="369">Traffic recorder</text><text class="small" x="353" y="394">外部观察面</text></g>
  <path class="flow" d="M468 374H594"/>
  <g transform="rotate(-.15 737 374)"><path d="M602 317Q587 318 589 334L590 413Q590 429 607 427L866 429Q883 428 881 411L883 334Q881 318 864 320Z" fill="#FAF9F5" stroke="#6A9BCC" stroke-width="5" stroke-linejoin="round"/><text class="label" x="736" y="369">Decoy tools</text><text class="small" x="736" y="398">+ signed summary</text></g>
  <path class="flow" d="M886 374H1014"/>
  <g transform="rotate(.12 1262 374)"><path d="M1021 326Q1008 327 1009 341L1011 406Q1011 419 1025 418L1498 420Q1511 419 1510 404L1511 342Q1510 328 1495 329Z" fill="#6A9BCC" stroke="#141413" stroke-width="4" stroke-linejoin="round"/><text class="label" x="1261" y="369">Limited observation</text><text class="small" x="1261" y="394">完整推理不外露</text></g>

  <path class="dash" d="M88 462C470 454 1102 468 1513 460"/>
  <text class="tiny" x="88" y="511">BOUNDARY 03</text><text class="rowtitle" x="88" y="543">请求真实性</text>
  <g transform="rotate(-.12 354 543)"><path d="M252 495Q239 496 240 510L242 575Q242 588 256 587L452 589Q465 588 464 573L465 511Q464 497 449 498Z" fill="#D97757" stroke="#141413" stroke-width="4" stroke-linejoin="round"/><text class="label" x="353" y="538">Modified client</text><text class="small" x="353" y="563">非官方二进制</text></g>
  <path class="flow" d="M468 543H575"/>
  <g transform="rotate(.2 737 543)"><path d="M737 471L891 543L737 615L583 543Z" fill="#788C5D" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="737" y="538">cch hash</text><text class="small" x="737" y="563" style="fill:#141413">server check</text></g>
  <path class="flow" d="M894 543H1014"/>
  <g transform="rotate(-.1 1262 543)"><path d="M1021 495Q1008 496 1009 510L1011 575Q1011 588 1025 587L1498 589Q1511 588 1510 573L1511 511Q1510 497 1495 498Z" fill="#FAF9F5" stroke="#788C5D" stroke-width="5" stroke-linejoin="round"/><text class="label" x="1261" y="538">Allow / reject</text><text class="small" x="1261" y="563">按请求证明放行</text></g>

  <path d="M94 660C414 648 1055 671 1507 656" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="800" y="707">对外不露身份 · 对观察者不露完整推理 · 对请求验证来源</text>
  <text class="small" x="800" y="739">按泄露代码的社区分析归纳；代码存在不等于线上功能已启用</text>
</svg>
