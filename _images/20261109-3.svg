<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" role="img" aria-labelledby="title desc">
  <title id="title">领域续训的三个决策：起点、配比与防遗忘审计</title>
  <desc id="desc">DeepSeekMath 从代码 base 出发续训 500B token；报告明确验证保留 20% 代码稳住代码评测，工程上用通用切片审计防遗忘。</desc>
  <defs>
    <style>
      .bg{fill:#FAF9F5}.ink{fill:none;stroke:#141413;stroke-linecap:round;stroke-linejoin:round}
      .ivory{fill:#FAF9F5;stroke:#141413;stroke-width:5}
      .orange{fill:#D97757;stroke:#141413;stroke-width:5}
      .blue{fill:#6A9BCC;stroke:#141413;stroke-width:5}
      .green{fill:#788C5D;stroke:#141413;stroke-width:5}
      .flow{fill:none;stroke:#141413;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#141413;stroke-width:3.5;stroke-dasharray:9 8;stroke-linecap:round}
      .title{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:36px;fill:#141413}
      .head{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:22px;fill:#141413}
      .label{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:20px;fill:#141413;text-anchor:middle}
      .on{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:20px;fill:#FAF9F5;text-anchor:middle}
      .small{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:15px;fill:#141413;text-anchor:middle}
      .sd{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:15px;fill:#FAF9F5;text-anchor:middle}
      .note{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:16px;fill:#141413}
      .bar{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:17px;fill:#141413;text-anchor:middle}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#141413" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="880"/>
  <text class="title" x="52" y="58">领域续训的三个决策：起点、配比与防遗忘审计</text>
  <path class="ink" d="M52 76C520 74 1280 78 1748 75" stroke-width="2.5"/>

  <rect class="blue" x="52" y="140" width="400" height="110" rx="22"/>
  <text class="on" x="252" y="186">DeepSeek-Coder-Base 7B</text>
  <text class="sd" x="252" y="216">起点：代码 base，不是通用 base</text>
  <rect class="ivory" x="52" y="282" width="400" height="88" rx="18" stroke-dasharray="10 8"/>
  <text class="label" x="252" y="318">起点消融（可选但便宜）</text>
  <text class="small" x="252" y="348">代码出发 &gt; 通用出发，迁移不对称</text>

  <path class="flow" d="M452 195H560" marker-end="url(#arrow)"/>

  <rect class="ivory" x="560" y="120" width="700" height="250" rx="24"/>
  <text class="head" x="592" y="166">续训 500B token 的配比</text>
  <rect x="592" y="192" width="358" height="44" class="blue" rx="8"/>
  <rect x="950" y="192" width="128" height="44" class="blue" rx="8"/>
  <rect x="1078" y="192" width="64" height="44" class="blue" rx="8"/>
  <rect x="1142" y="192" width="64" height="44" class="blue" rx="8"/>
  <rect x="1206" y="192" width="26" height="44" class="blue" rx="8"/>
  <text class="bar" x="771" y="264">数学网页 56%</text>
  <text class="bar" x="1014" y="264">代码 20%</text>
  <text class="bar" x="1110" y="300">arXiv 10%</text>
  <text class="bar" x="1174" y="336">自然语言 10%</text>
  <path class="ink" d="M1110 276V242" stroke-width="2"/>
  <path class="ink" d="M1174 312V242" stroke-width="2"/>
  <text class="small" x="1166" y="174">AlgebraicStack 4%</text>
  <path class="ink" d="M1219 180V192" stroke-width="2"/>

  <path class="flow" d="M1260 245H1360" marker-end="url(#arrow)"/>

  <polygon points="1540,150 1720,245 1540,340 1360,245" class="green"/>
  <text class="on" x="1540" y="236">消融后再信</text>
  <text class="sd" x="1540" y="264">最像 ≠ 最有用</text>

  <rect class="ivory" x="560" y="430" width="700" height="150" rx="22"/>
  <text class="label" x="910" y="478">防遗忘靠配比与通用切片双保险</text>
  <text class="small" x="910" y="510">报告明确验证：保留 20% 代码稳住 HumanEval / MBPP；10% 自然语言列在配比中</text>
  <text class="small" x="910" y="540">工程检查：10% 自然语言只是配比；在冻结通用集上算 backward transfer 与 KL</text>

  <rect class="orange" x="1360" y="430" width="388" height="150" rx="22"/>
  <text class="on" x="1554" y="482">DeepSeekMath-Base 7B</text>
  <text class="sd" x="1554" y="514">GSM8K 64.2% / MATH 36.2%</text>
  <text class="sd" x="1554" y="544">few-shot，绑定该设置</text>
  <path class="flow" d="M1540 340V430" marker-end="url(#arrow)"/>

  <rect class="ivory" x="52" y="430" width="400" height="150" rx="22"/>
  <text class="label" x="252" y="478">消融的反直觉结果</text>
  <text class="small" x="252" y="510">arXiv 10% 在他们的消融里</text>
  <text class="small" x="252" y="540">没有带来可测的提升</text>

  <text class="note" x="52" y="660">配比数字来自 DeepSeekMath 技术报告。续训与退火升配的边界在预算与幅度：几十 B 调权重是退火，几百 B 换分布是续训。</text>
  <text class="note" x="52" y="696">arXiv 的结论不是「arXiv 没用」，是「这个规模、这组评测下没测出用处」——把直觉上该有用的数据也放进消融名单。</text>
  <text class="note" x="52" y="732">产出仍是 base model：懂更多数学，但监督信号的位置没变。</text>
</svg>
