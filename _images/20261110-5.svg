<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">SFT 打包之后：三件事各自断言</title>
  <desc id="desc">三条样本打进一条序列后，注意力边界、loss mask 与位置计数是三件独立的事；位置是否重置取决于位置编码。</desc>
  <defs>
    <style>
      .bg{fill:#FAF9F5}.ink{fill:none;stroke:#141413;stroke-linecap:round;stroke-linejoin:round}
      .ivory{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .orange{fill:#D97757;stroke:#141413;stroke-width:4.5}
      .blue{fill:#6A9BCC;stroke:#141413;stroke-width:4.5}
      .green{fill:#788C5D;stroke:#141413;stroke-width:4.5}
      .dash{fill:#FAF9F5;stroke:#141413;stroke-width:4;stroke-dasharray:9 8}
      .panel{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .grad{fill:none;stroke:#141413;stroke-width:3.5;stroke-dasharray:10 9;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#141413;stroke-width:2.5;stroke-linecap:round}
      .title{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:34px;fill:#141413}
      .head{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:21px;fill:#141413}
      .label{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#141413;text-anchor:middle}
      .on{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#FAF9F5;text-anchor:middle}
      .small{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413;text-anchor:middle}
      .sd{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#FAF9F5;text-anchor:middle}
      .note{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:16px;fill:#141413}
      .axis{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413}
      .lsmall{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="820"/>
  <text class="title" x="52" y="56">SFT 打包之后：三件事各自断言</text>
  <path class="ink" d="M52 74C520 72 1280 76 1748 73" stroke-width="2.5"/>
  <text class="head" x="52" y="126">一条打包后的序列</text>
  <rect class="blue" x="52" y="150" width="430" height="70" rx="14"/>
  <text class="on" x="267.0" y="191">样本 A</text>
  <rect class="blue" x="500" y="150" width="300" height="70" rx="14"/>
  <text class="on" x="650.0" y="191">样本 B</text>
  <rect class="blue" x="818" y="150" width="380" height="70" rx="14"/>
  <text class="on" x="1008.0" y="191">样本 C</text>
  <rect class="dash" x="1300" y="150" width="448" height="70" rx="14"/>
  <text class="label" x="1524.0" y="191">同一条序列，三条样本互不相干</text>
  <rect class="panel" x="52" y="270" width="540" height="400" rx="26"/>
  <text class="head" x="84" y="316">注意力边界</text>
  <rect x="110" y="334" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="110" y="358" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="134" y="358" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="110" y="382" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="134" y="382" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="158" y="382" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="110" y="406" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="134" y="406" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="158" y="406" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="182" y="406" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="206" y="430" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="206" y="454" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="230" y="454" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="206" y="478" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="230" y="478" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="254" y="478" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="278" y="502" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="278" y="526" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="302" y="526" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="278" y="550" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="302" y="550" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="326" y="550" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="278" y="574" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="302" y="574" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="326" y="574" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="350" y="574" width="21" height="21" rx="4" fill="#6A9BCC" stroke="#141413" stroke-width="1.6"/>
  <rect x="106" y="330" width="269" height="269" rx="8" fill="none" stroke="#141413" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="lsmall" x="410" y="420">后面的样本</text>
  <text class="lsmall" x="410" y="446">看不见前面的</text>
  <text class="lsmall" x="84" y="648">sample masking：只在各自样本内可见</text>
  <rect class="panel" x="630" y="270" width="540" height="400" rx="26"/>
  <text class="head" x="662" y="316">Loss mask</text>
  <rect class="dash" x="662" y="350" width="150" height="60" rx="12"/>
  <text class="label" x="737.0" y="386">prompt</text>
  <rect class="blue" x="820" y="350" width="130" height="60" rx="12"/>
  <text class="on" x="885.0" y="386">回答</text>
  <rect class="dash" x="958" y="350" width="180" height="60" rx="12"/>
  <text class="label" x="1048.0" y="386">下一条 prompt</text>
  <text class="lsmall" x="662" y="470">每条样本内部仍是四种策略之一</text>
  <text class="lsmall" x="662" y="504">打包不改变它</text>
  <text class="lsmall" x="662" y="564">要查的是拼接处：</text>
  <text class="lsmall" x="662" y="598">前一条的终止符、后一条的起始标记</text>
  <text class="lsmall" x="662" y="648">各自的 label 对不对</text>
  <rect class="panel" x="1208" y="270" width="540" height="400" rx="26"/>
  <text class="head" x="1240" y="316">位置</text>
  <polygon points="1478,330 1668,392 1478,454 1288,392" class="green"/>
  <text class="on" x="1478" y="398">位置编码是哪一种</text>
  <rect class="ivory" x="1240" y="500" width="230" height="110" rx="18"/>
  <text class="label" x="1355.0" y="535">相对位置（RoPE）</text>
  <text class="small" x="1355.0" y="563">平移不改变分数</text>
  <text class="small" x="1355.0" y="587">重置是卫生习惯</text>
  <rect class="ivory" x="1486" y="500" width="230" height="110" rx="18"/>
  <text class="label" x="1601.0" y="535">绝对位置</text>
  <text class="small" x="1601.0" y="563">后段样本只见过大位置</text>
  <text class="small" x="1601.0" y="587">必须重置</text>
  <path class="flow" d="M1400 440L1370 500" marker-end="url(#arrow)"/>
  <path class="flow" d="M1556 440L1590 500" marker-end="url(#arrow)"/>
  <text class="lsmall" x="1240" y="648">V3 报告没写 SFT 打包是否重置位置</text>
  <text class="note" x="52" y="730">蓝色格子是允许的注意力或参与损失的 token，虚线是被 mask 的部分。三件事互不替代，各写一条断言。</text>
  <text class="note" x="52" y="764">注意力不隔离时，后面的样本在训练里多了一段无关的条件，推理时没有。</text>
</svg>
