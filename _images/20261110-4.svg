<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 860" role="img" aria-labelledby="title desc">
  <title id="title">一条 assistant 消息渲染之后：每个 token 进不进损失</title>
  <desc id="desc">以 Llama 3 模板为例，header 属于 prompt 不进损失，正文与终止符进损失；下方三格是 loss 看不出来的三种模板错误。</desc>
  <defs>
    <style>
      .bg{fill:#FAF9F5}.ink{fill:none;stroke:#141413;stroke-linecap:round;stroke-linejoin:round}
      .ivory{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .orange{fill:#D97757;stroke:#141413;stroke-width:4.5}
      .blue{fill:#6A9BCC;stroke:#141413;stroke-width:4.5}
      .green{fill:#788C5D;stroke:#141413;stroke-width:4.5}
      .dash{fill:#FAF9F5;stroke:#141413;stroke-width:4;stroke-dasharray:9 8}
      .panel{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .grad{fill:none;stroke:#141413;stroke-width:3.5;stroke-dasharray:10 9;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#141413;stroke-width:2.5;stroke-linecap:round}
      .title{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:34px;fill:#141413}
      .head{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:21px;fill:#141413}
      .label{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#141413;text-anchor:middle}
      .on{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#FAF9F5;text-anchor:middle}
      .small{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413;text-anchor:middle}
      .sd{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#FAF9F5;text-anchor:middle}
      .note{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:16px;fill:#141413}
      .axis{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413}
      .lsmall{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="860"/>
  <text class="title" x="52" y="56">一条 assistant 消息渲染之后：每个 token 进不进损失</text>
  <path class="ink" d="M52 74C520 72 1280 76 1748 73" stroke-width="2.5"/>
  <text class="head" x="52" y="126">渲染出的 token（从左到右）</text>
  <rect class="dash" x="52" y="150" width="228" height="84" rx="14"/>
  <text class="label" x="166.0" y="198">header 开始</text>
  <rect class="dash" x="300" y="150" width="228" height="84" rx="14"/>
  <text class="label" x="414.0" y="198">assistant</text>
  <rect class="dash" x="548" y="150" width="228" height="84" rx="14"/>
  <text class="label" x="662.0" y="198">header 结束</text>
  <rect class="dash" x="796" y="150" width="194" height="84" rx="14"/>
  <text class="label" x="893.0" y="198">两个换行</text>
  <rect class="blue" x="1010" y="150" width="270" height="84" rx="14"/>
  <text class="on" x="1145.0" y="198">正文</text>
  <rect class="blue" x="1300" y="150" width="228" height="84" rx="14"/>
  <text class="on" x="1414.0" y="198">终止符</text>
  <text class="head" x="52" y="290">对应的 label</text>
  <rect class="dash" x="52" y="314" width="228" height="70" rx="14"/>
  <text class="label" x="166.0" y="355">-100</text>
  <rect class="dash" x="300" y="314" width="228" height="70" rx="14"/>
  <text class="label" x="414.0" y="355">-100</text>
  <rect class="dash" x="548" y="314" width="228" height="70" rx="14"/>
  <text class="label" x="662.0" y="355">-100</text>
  <rect class="dash" x="796" y="314" width="194" height="70" rx="14"/>
  <text class="label" x="893.0" y="355">-100</text>
  <rect class="ivory" x="1010" y="314" width="270" height="70" rx="14"/>
  <text class="label" x="1145.0" y="355">等于 token 自己</text>
  <rect class="ivory" x="1300" y="314" width="228" height="70" rx="14"/>
  <text class="label" x="1414.0" y="355">等于 token 自己</text>
  <rect class="orange" x="1580" y="142" width="168" height="100" rx="18"/>
  <text class="on" x="1664.0" y="186">参数</text>
  <text class="sd" x="1664.0" y="214">只从蓝色收梯度</text>
  <path class="grad" d="M1528 192H1580" marker-end="url(#arrow)"/>
  <path class="grad" d="M1145 150C1145 96 1664 96 1664 142" marker-end="url(#arrow)"/>
  <text class="lsmall" x="52" y="430">推理时：前四格由外部补上，模型从正文的第一个 token 写起，写到终止符停。</text>
  <rect class="panel" x="52" y="470" width="540" height="250" rx="26"/>
  <text class="head" x="84" y="516">终止符被设成 -100</text>
  <text class="note" x="84" y="566">回答写完不停</text>
  <text class="lsmall" x="84" y="600">一直写到长度上限，或开始重复</text>
  <text class="lsmall" x="84" y="660">其余位置都学得很好，loss 正常</text>
  <rect class="panel" x="630" y="470" width="540" height="250" rx="26"/>
  <text class="head" x="662" y="516">user 的内容进了损失</text>
  <text class="note" x="662" y="566">答完接着替用户提问</text>
  <text class="lsmall" x="662" y="600">多了一段可学的文本</text>
  <text class="lsmall" x="662" y="660">loss 只会更低</text>
  <rect class="panel" x="1208" y="470" width="540" height="250" rx="26"/>
  <text class="head" x="1240" y="516">训练和推理不是同一份模板</text>
  <text class="note" x="1240" y="566">质量整体下降，格式偶尔漂移</text>
  <text class="lsmall" x="1240" y="600">常见：开头多一个起始标记</text>
  <text class="lsmall" x="1240" y="660">训练集和验证集一致地错</text>
  <text class="note" x="52" y="780">蓝色是参与损失的 token，虚线边框是被 mask 的 token，虚线箭头是回到参数的梯度。</text>
  <text class="note" x="52" y="814">label 和 input_ids 是同一条序列，错位由模型内部完成；「进损失」的意思是这个位置的 label 等于它自己。</text>
</svg>
