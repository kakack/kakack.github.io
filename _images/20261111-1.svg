<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc">
  <title id="title">黑盒与白盒蒸馏，评估回流到数据契约</title>
  <desc id="desc">黑盒采样轨迹做 SFT，白盒对齐教师分布，蒸馏梯度指向可训练 Student；分项评估失败沿虚线回流到数据契约与 manifest。</desc>
  <defs>
    <style>
      .bg{fill:#FAF9F5}.ink{fill:none;stroke:#141413;stroke-linecap:round;stroke-linejoin:round}
      .ivory{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .orange{fill:#D97757;stroke:#141413;stroke-width:4.5}
      .blue{fill:#6A9BCC;stroke:#141413;stroke-width:4.5}
      .green{fill:#788C5D;stroke:#141413;stroke-width:4.5}
      .dash{fill:#FAF9F5;stroke:#141413;stroke-width:4;stroke-dasharray:8 7}
      .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round}
      .grad{fill:none;stroke:#141413;stroke-width:3.5;stroke-dasharray:10 9;stroke-linecap:round}
      .title{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:34px;fill:#141413}
      .on{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#FAF9F5;text-anchor:middle}
      .label{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#141413;text-anchor:middle}
      .small{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413;text-anchor:middle}
      .sd{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#FAF9F5;text-anchor:middle}
      .note{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:16px;fill:#141413}
      .head{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:20px;fill:#141413}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="660"/>
  <text class="title" x="52" y="56">黑盒与白盒蒸馏，评估回流到数据契约</text>
  <path class="ink" d="M52 74C520 72 1280 76 1748 73" stroke-width="2.5"/>

  <rect class="blue" x="52" y="190" width="240" height="110" rx="18"/>
  <text class="on" x="172" y="236">数据契约与 manifest</text>
  <text class="sd" x="172" y="266">prompt・谱系・长度・holdout</text>
  <path class="flow" d="M292 245H350" marker-end="url(#arrow)"/>

  <rect class="blue" x="350" y="190" width="210" height="110" rx="18"/>
  <text class="on" x="455" y="236">Teacher</text>
  <text class="sd" x="455" y="266">冻结，带版本</text>

  <rect class="ivory" x="620" y="138" width="340" height="92" rx="18"/>
  <text class="label" x="790" y="178">黑盒：采样轨迹，SFT 损失</text>
  <text class="small" x="790" y="206">轨迹长度分布记回 manifest</text>

  <rect class="ivory" x="620" y="260" width="340" height="92" rx="18"/>
  <text class="label" x="790" y="300">白盒：对齐教师分布（KL）</text>
  <text class="small" x="790" y="328">看得到教师在每个 token 上的分布</text>

  <path class="flow" d="M560 220C590 220 590 184 620 184" marker-end="url(#arrow)"/>
  <path class="flow" d="M560 270C590 270 590 306 620 306" marker-end="url(#arrow)"/>

  <rect class="orange" x="1030" y="190" width="240" height="110" rx="18"/>
  <text class="on" x="1150" y="236">Student</text>
  <text class="sd" x="1150" y="266">可训练</text>

  <path class="grad" d="M960 184C995 184 995 225 1030 225" marker-end="url(#arrow)"/>
  <path class="grad" d="M960 306C995 306 995 265 1030 265" marker-end="url(#arrow)"/>

  <path class="flow" d="M1270 245H1340" marker-end="url(#arrow)"/>
  <rect class="green" x="1340" y="185" width="408" height="120" rx="18"/>
  <text class="on" x="1544" y="234">分项评估：不合成单一总分</text>
  <text class="sd" x="1544" y="266">能力・偏好・污染・judge 版本</text>

  <path class="grad" d="M1544 305C1544 532 172 532 172 300" marker-end="url(#arrow)"/>
  <text class="small" x="858" y="432">评测失败指回 manifest、tool schema 版本与 teacher / policy checkpoint</text>

  <text class="note" x="52" y="616">实线是主流程，虚线表示反馈（蒸馏梯度指向可训练 Student，评测失败回流到数据契约），与第二篇图 1 一致。</text>
</svg>
