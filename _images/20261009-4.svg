<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" role="img" aria-labelledby="title desc">
  <title id="title">PPO-RLHF 里，一条回答怎样变成一步更新</title>
  <desc id="desc">逐 token 的 KL 惩罚折进奖励，RM 分数只加在最后一个 token；Critic 的价值经 GAE 变成每个位置的优势，再进 PPO 的裁剪目标。</desc>
  <defs>
    <style>
      .bg{fill:#FAF9F5}.ink{fill:none;stroke:#141413;stroke-linecap:round;stroke-linejoin:round}
      .ivory{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .orange{fill:#D97757;stroke:#141413;stroke-width:4.5}
      .blue{fill:#6A9BCC;stroke:#141413;stroke-width:4.5}
      .green{fill:#788C5D;stroke:#141413;stroke-width:4.5}
      .dash{fill:#FAF9F5;stroke:#141413;stroke-width:4;stroke-dasharray:9 8}
      .panel{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .grad{fill:none;stroke:#141413;stroke-width:3.5;stroke-dasharray:10 9;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#141413;stroke-width:2.5;stroke-linecap:round}
      .title{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:34px;fill:#141413}
      .head{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:700;font-size:21px;fill:#141413}
      .label{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#141413;text-anchor:middle}
      .on{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:600;font-size:18px;fill:#FAF9F5;text-anchor:middle}
      .small{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413;text-anchor:middle}
      .sd{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#FAF9F5;text-anchor:middle}
      .note{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:16px;fill:#141413}
      .axis{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413}
      .lsmall{font-family:Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;font-weight:500;font-size:14px;fill:#141413}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="880"/>
  <text class="title" x="52" y="56">PPO-RLHF 里，一条回答怎样变成一步更新</text>
  <path class="ink" d="M52 74C520 72 1280 76 1748 73" stroke-width="2.5"/>
  <text class="head" x="52" y="126">一条采样出的回答，逐 token 的奖励</text>
  <rect class="blue" x="52" y="150" width="200" height="84" rx="14"/>
  <text class="on" x="152.0" y="198">token 1</text>
  <rect class="ivory" x="52" y="262" width="200" height="96" rx="14"/>
  <text class="label" x="152.0" y="304">−β·log 比值</text>
  <text class="small" x="152.0" y="332">不带梯度的数</text>
  <rect class="blue" x="270" y="150" width="200" height="84" rx="14"/>
  <text class="on" x="370.0" y="198">token 2</text>
  <rect class="ivory" x="270" y="262" width="200" height="96" rx="14"/>
  <text class="label" x="370.0" y="304">−β·log 比值</text>
  <text class="small" x="370.0" y="332">不带梯度的数</text>
  <rect class="blue" x="488" y="150" width="200" height="84" rx="14"/>
  <text class="on" x="588.0" y="198">token 3</text>
  <rect class="ivory" x="488" y="262" width="200" height="96" rx="14"/>
  <text class="label" x="588.0" y="304">−β·log 比值</text>
  <text class="small" x="588.0" y="332">不带梯度的数</text>
  <rect class="blue" x="706" y="150" width="200" height="84" rx="14"/>
  <text class="on" x="806.0" y="198">token 4</text>
  <rect class="ivory" x="706" y="262" width="200" height="96" rx="14"/>
  <text class="label" x="806.0" y="304">−β·log 比值</text>
  <text class="small" x="806.0" y="332">不带梯度的数</text>
  <rect class="blue" x="924" y="150" width="200" height="84" rx="14"/>
  <text class="on" x="1024.0" y="198">token T</text>
  <rect class="orange" x="924" y="262" width="200" height="96" rx="14"/>
  <text class="on" x="1024.0" y="304">−β·log 比值 + RM 分数</text>
  <text class="sd" x="1024.0" y="332">RM 只在这里出现</text>
  <text class="lsmall" x="1160" y="200">token 级的对数概率比：</text>
  <text class="lsmall" x="1160" y="228">策略相对 Reference</text>
  <text class="lsmall" x="1160" y="300">RM 给整条回答一个分数，</text>
  <text class="lsmall" x="1160" y="328">只加在最后一个位置</text>
  <rect class="blue" x="52" y="470" width="300" height="110" rx="18"/>
  <text class="on" x="202.0" y="505">Critic 的价值 V</text>
  <text class="sd" x="202.0" y="533">每个前缀一个估计</text>
  <text class="sd" x="202.0" y="557">可训练</text>
  <rect class="ivory" x="450" y="470" width="320" height="110" rx="18"/>
  <text class="label" x="610.0" y="519">GAE</text>
  <text class="small" x="610.0" y="547">把结尾的分数往前传</text>
  <rect class="ivory" x="868" y="470" width="320" height="110" rx="18"/>
  <text class="label" x="1028.0" y="519">每个位置的优势</text>
  <text class="small" x="1028.0" y="547">Critic 估不准，这里就是噪声</text>
  <rect class="ivory" x="1286" y="470" width="300" height="110" rx="18"/>
  <text class="label" x="1436.0" y="519">PPO 裁剪目标</text>
  <text class="small" x="1436.0" y="547">新旧策略的概率比</text>
  <path class="flow" d="M352 525H450" marker-end="url(#arrow)"/>
  <path class="flow" d="M770 525H868" marker-end="url(#arrow)"/>
  <path class="flow" d="M1188 525H1286" marker-end="url(#arrow)"/>
  <path class="flow" d="M610 358V470" marker-end="url(#arrow)"/>
  <text class="lsmall" x="626" y="420">逐 token 奖励</text>
  <rect class="orange" x="1286" y="660" width="300" height="100" rx="18"/>
  <text class="on" x="1436.0" y="704">Actor</text>
  <text class="sd" x="1436.0" y="732">策略梯度更新</text>
  <path class="grad" d="M1436 580V660" marker-end="url(#arrow)"/>
  <rect class="ivory" x="52" y="660" width="300" height="100" rx="18"/>
  <text class="label" x="202.0" y="704">价值损失</text>
  <text class="small" x="202.0" y="732">回归到回报</text>
  <path class="grad" d="M202 660V580" marker-end="url(#arrow)"/>
  <rect class="dash" x="450" y="660" width="738" height="100" rx="18"/>
  <text class="label" x="819.0" y="704">InstructGPT 的 PPO-ptx：再混入预训练目标的梯度</text>
  <text class="small" x="819.0" y="732">防止在公开 NLP 数据集上退步</text>
  <path class="grad" d="M1188 710H1286" marker-end="url(#arrow)"/>
  <text class="note" x="52" y="820">实线是主流程，虚线表示反馈（梯度）。KL 折进奖励后是一个不带梯度的数，经 Critic 和 GAE 才变成优势。</text>
  <text class="note" x="52" y="854">对比第六篇：GRPO 把 KL 直接写在损失里，对策略求导，不经过优势。两处不是同一个开关。</text>
</svg>
