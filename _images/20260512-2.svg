idth="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="1325.0" y="283.5" style="text-anchor:middle;fill:#FAF9F5">Commit + Handoff</text><text class="tiny" x="1325.0" y="313.5" style="text-anchor:middle;fill:#FAF9F5">已知良好状态</text></g><path class="flowO" d="M245 283H285"/><path class="flowO" d="M510 283H550"/><path class="flowO" d="M775 283H825"/><path class="flowO" d="M1103 283H1185"/><text class="small" x="1145" y="250" style="text-anchor:middle;fill:#788C5D">YES</text><g transform="rotate(0 917.5 562.5)"><path d="M818 512 Q803 513 802 528 L804 598 Q805 613 820 614 L1017 612 Q1033 613 1032 596 L1034 528 Q1032 513 1016 514 Z" fill="#6A9BCC" stroke="#141413" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="917.5" y="563.5" style="text-anchor:middle;fill:#FAF9F5">记录失败</text><text class="tiny" x="917.5" y="593.5" style="text-anchor:middle;fill:#FAF9F5">trace · screenshot</text></g><g transform="rotate(0 597.5 562.5)"><path d="M493 512 Q478 513 477 528 L479 598 Q480 613 495 614 L702 612 Q718 613 717 596 L719 528 Q717 513 701 514 Z" fill="#FAF9F5" stroke="#D97757" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="597.5" y="563.5" style="text-anchor:middle;fill:#141413">加固 Harness</text><text class="tiny" x="597.5" y="593.5" style="text-anchor:middle;fill:#756F68">规则 · 脚本 · 测试</text></g><path class="flow" d="M970 365V490"/><path class="flow" d="M800 562H735"/><path class="flow" d="M475 562H390V350H405" stroke-dasharray="10 10"/><text class="small" x="1005" y="450" style="text-anchor:middle;fill:#D97757">NO</text><text class="small" x="310" y="690" style="text-anchor:start">失败不是一次性对话，而是下一轮自动检查的输入</text></svg>
