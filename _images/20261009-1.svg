<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 780" role="img" aria-labelledby="title desc">
  <title id="title">PPO 四模型与 DPO 两模型</title>
  <desc id="desc">PPO 里 Actor 采样，RM 打分，Reference 提供 KL，Critic 估计优势。DPO 只更新 Policy。</desc>
  <defs>
    <style>
      .bg{fill:#FAF9F5}.ink{fill:none;stroke:#141413;stroke-linecap:round;stroke-linejoin:round}
      .ivory{fill:#FAF9F5;stroke:#141413;stroke-width:4.5}
      .orange{fill:#D97757;stroke:#141413;stroke-width:4.5}
      .blue{fill:#6A9BCC;stroke:#141413;stroke-width:4.5}
      .green{fill:#788C5D;stroke:#141413;stroke-width:4.5}
      .dash{fill:#FAF9F5;stroke:#141413;stroke-width:4;stroke-dasharray:8 7}
      .flow{fill:none;stroke:#141413;stroke-width:4;stroke-linecap:round}
      .grad{fill:none;stroke:#141413;stroke-width:3.5;stroke-dasharray:10 9;stroke-linecap:round}
      .title{font:700 34px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#141413}
      .on{font:600 18px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#FAF9F5;text-anchor:middle}
      .label{font:600 18px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#141413;text-anchor:middle}
      .small{font:500 14px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#141413;text-anchor:middle}
      .sd{font:500 14px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#FAF9F5;text-anchor:middle}
      .note{font:500 16px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#141413}
      .head{font:700 20px Poppins,'Hiragino Sans GB','PingFang SC',sans-serif;fill:#141413}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L14 8L2 14" fill="none" stroke="#141413" stroke-width="2.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="780"/>
  <text class="title" x="52" y="56">PPO 四模型与 DPO 两模型</text>
  <path class="ink" d="M52 74C520 72 1280 76 1748 73" stroke-width="2.5"/>
  
  <text class="head" x="52" y="130">PPO：一次更新里四个角色同时在场</text>
  <rect class="orange" x="52" y="170" width="250" height="110" rx="18"/>
  <rect class="blue" x="430" y="170" width="280" height="110" rx="18"/>
  <rect class="dash" x="840" y="170" width="300" height="110" rx="18"/>
  <rect class="green" x="1260" y="170" width="280" height="110" rx="18"/>
  <text class="on" x="177" y="214">Actor</text><text class="sd" x="177" y="244">采样，可训练</text>
  <text class="on" x="570" y="214">Reward model</text><text class="sd" x="570" y="244">打分，冻结</text>
  <text class="label" x="990" y="214">Reference</text><text class="small" x="990" y="244">KL，冻结</text>
  <text class="on" x="1400" y="214">Critic</text><text class="sd" x="1400" y="244">优势，可训练</text>
  <path class="flow" d="M302 225H430" marker-end="url(#arrow)"/>
  <path class="flow" d="M710 225H840" marker-end="url(#arrow)"/>
  <path class="flow" d="M1140 225H1260" marker-end="url(#arrow)"/>
  <path class="grad" d="M1400 280C1400 390 177 390 177 280" marker-end="url(#arrow)"/>

  <text class="head" x="52" y="450">DPO：同一张图里少掉 Critic 和显式 RM</text>
  <rect class="orange" x="52" y="490" width="320" height="110" rx="18"/>
  <rect class="dash" x="500" y="490" width="360" height="110" rx="18"/>
  <rect class="ivory" x="1000" y="490" width="540" height="110" rx="18"/>
  <text class="on" x="212" y="534">Policy</text><text class="sd" x="212" y="564">可训练</text>
  <text class="label" x="680" y="534">Reference</text><text class="small" x="680" y="564">对数概率可预计算</text>
  <text class="label" x="1270" y="534">分类损失直接比较两条对数比</text>
  <text class="small" x="1270" y="564">没有在线采样，也没有 Critic</text>
  <path class="flow" d="M372 545H500" marker-end="url(#arrow)"/>
  <path class="grad" d="M212 600C212 680 680 680 680 600" marker-end="url(#arrow)"/>
  <text class="note" x="52" y="740">实线是主流程，虚线表示反馈（梯度），与第二篇图 1 一致。虚线框是冻结模型。颜色仍表示起止、决策和资产。</text>

</svg>
