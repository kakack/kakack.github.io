# Content for the home page: the eight-station pipeline and the travel photo strip.
# Edit this file to change the home page; index.html does not need to change.

# Each station is one article of the training series. `url` is the post's path on the site,
# `figure` is a file in _images/, and `hue` is the station's greyed colour (the pinned
# section tints itself with it).
stages:
  - name: Getting ready
    question: What has to be locked down before the first batch reaches a GPU.
    url: /LLM-Training-Pipeline-Part1-Overview-and-Data-Engineering/
    figure: 20260813-1.png
    hue: "#B7A990"
  - name: Pretraining
    question: How the next-token objective moves through one step, and what to check first when the loss spikes.
    url: /LLM-Training-Pipeline-Part2-Pretrain/
    figure: 20261106-1.png
    hue: "#8A9BAE"
  - name: Mid-training
    question: The learning rate is falling and the data mix is changing. Which one earned the gain?
    url: /LLM-Training-Pipeline-Part3-Midtraining/
    figure: 20261109-1.png
    hue: "#A39AAE"
  - name: SFT
    question: Supervision moves from every token to some tokens, and the loss mask draws the line.
    url: /LLM-Training-Pipeline-Part4-SFT/
    figure: 20261110-1.png
    hue: "#94A596"
  - name: Preference alignment
    question: Four models are in the room. Which ones score, and which ones update?
    url: /LLM-Training-Pipeline-Part5-Preference/
    figure: 20261009-1.png
    hue: "#C4A29E"
  - name: Reasoning RL
    question: Rewards can now be checked by rules. Three ways training still gets out of hand.
    url: /LLM-Training-Pipeline-Part6-RLVR/
    figure: 20261023-1.png
    hue: "#7F9A9A"
  - name: Agentic training
    question: The reward waits at the end of a trajectory. Which tokens does the gradient reach?
    url: /LLM-Training-Pipeline-Part7-Agentic/
    figure: 20261104-1.png
    hue: "#BFA778"
  - name: Distillation and evaluation
    question: Moving the capability into a smaller model, and making scores point back at the data.
    url: /LLM-Training-Pipeline-Part8-Distill-Eval/
    figure: 20261111-1.png
    hue: "#9A8C84"

